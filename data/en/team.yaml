members:
  - name: "Prof. Zheng Guoxin"
    title: "Ph.D. Supervisor, School of Communication and Information Engineering, Shanghai University"
    photo: ""
    bio_paragraphs:
      - "Prof. Zheng Guoxin has long been dedicated to the teaching and research of confined-space radio communication, achieving numerous significant results in the field of urban rail transit wireless communication. He has led multiple NSFC projects (both general and key projects), sub-projects of the National 863 Program on high-speed maglev transportation technology, and major projects of the Shanghai Science and Technology Commission."
      - "He received his B.S. in Radio Technology from Taiyuan Institute of Technology in 1981, and his M.S. in Industrial Automation from Shanxi Mining Institute in 1987. He taught at Taiyuan University of Technology from 1987 to 2000, becoming a full professor in 1999. He was a visiting researcher at the Microwave Laboratory of the Chinese University of Hong Kong in 1995 and a TCT visiting scholar at the School of Electrical and Electronic Engineering, Nanyang Technological University, Singapore in 2005. He has been at Shanghai University since 2000 as a Ph.D. supervisor."
    roles:
      - "Member, Microwave Committee, Chinese Institute of Electronics; Chair, Microwave and Optical Communication Division"
      - "Council Member, Shanghai Electronics Society; Vice Chair, Microwave Professional Committee"
      - "Fellow, Institution of Engineering and Technology (IET)"
      - "International Bid Evaluation Expert, Urban Rail Transit Signaling Systems, China"
      - "Member, Rail Transit Electrification Committee, Shanghai Electrical Engineering Society"
      - "Member, Rail Transit Expert Committee, Shanghai Transportation Electronics Industry Association"
      - "Member, Signaling Committee, Shanghai Shentong Metro Group"
      - "Member, Technical Committee, Shanghai URT Unattended Train Control System Engineering Center"
