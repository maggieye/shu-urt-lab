directions:
  - icon: "satellite-dish"
    title: "轨道交通车地无线传输规律与信道建模"
    description: "研究隧道等限定空间环境下的电磁波传播理论，构建从 Sub-6 GHz 到毫米波（mmWave）的多频段信道模型，包括路径损耗、时延扩展、多普勒频移等关键参数，为轨道交通无线通信系统设计提供理论支撑。"
  - icon: "shield-check"
    title: "高可靠性的列车控制通信系统"
    description: "面向基于通信的列车控制（CBTC）系统，研究 4G/5G（LTE-M）通信在低时延、高可靠性方面的技术条件，攻克信号系统与通信系统对接试验等工程难题，保障列车运行安全。"
  - icon: "microchip"
    title: "限定空间 MIMO 毫米波传输特性研究"
    description: "探索隧道、车站等限定空间中多输入多输出（MIMO）天线系统在毫米波频段的传输特性，研究 RIS（可重构智能表面）辅助通信、信道相关性及容量优化等前沿技术。"
  - icon: "lock"
    title: "轨道交通无线通信的信息安全"
    description: "研究轨道交通无线通信系统的信息安全防护技术，包括国产密码算法（祖冲之密码）在 CBTC 系统中的应用、LTE-M 系统专用信息安全防护装备开发与性能测试。"
