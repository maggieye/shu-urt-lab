members:
  - name: "郑国莘 教授"
    title: "博士生导师，上海大学通信与信息工程学院"
    photo: ""
    bio_paragraphs:
      - '郑国莘教授长期从事限定空间无线电通信的教学和研究工作，在城市轨道交通无线通信领域取得了多项重要成果。主持多项国家自然科学基金项目（面上项目和重点项目）、国家"863"计划高速磁浮交通技术重大专项子课题、上海市科委重大项目等。'
      - "1981年毕业于太原工学院无线电技术专业本科，1987年在山西矿山学院工业自动化专业获硕士学位。1987年至2000年在太原理工大学任教，1999年任教授。1995年应邀在香港中文大学微波实验室任助研，2005年应邀在新加坡南洋理工大学电子电气工程系任TCT交流学者。2000年起在上海大学任教，担任博士生导师。"
    roles:
      - "中国电子学会微波专业委员会委员，微波与光通信分会主任委员"
      - "上海市电子学会理事，微波专业委员会副主任委员"
      - "IET（英国工程技术学会）资深会员"
      - "中国城市轨道交通信号系统国际评标专家"
      - "上海市电机工程学会轨道交通电气化专业委员会委员"
      - "上海交通电子行业协会轨道交通专家委员会委员"
      - "上海申通地铁集团信号专业委员会委员"
      - "上海市轨道交通无人驾驶列控系统工程中心技术委员会委员"
    awards:
      - year: "2025"
        name: "中国城市轨道交通协会科技进步一等奖"
      - year: "2019"
        name: "上海市科技进步奖二等奖"
      - year: "2014"
        name: "上海市科技进步奖三等奖"
      - year: "2010"
        name: "上海市科技进步奖三等奖"
      - year: "2010"
        name: "上海国际工博会高校展区一等奖"
      - year: "2009"
        name: "上海市级教学成果二等奖"
      - year: "2008"
        name: "上海大学校级教学成果特等奖"
      - year: "2008"
        name: "宝钢优秀教师奖"
      - year: "2000"
        name: "山西省科技进步二等奖"
