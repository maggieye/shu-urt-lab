<header class="navbar navbar-expand-lg navbar-dark sticky-top" id="site-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="{{ relLangURL "/" }}">
      <i class="fa-solid fa-train-subway me-2"></i>
      <span class="brand-text">{{ .Site.Params.labName }}</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navOffcanvas" aria-controls="navOffcanvas">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="offcanvas offcanvas-end" tabindex="-1" id="navOffcanvas">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">{{ .Site.Title }}</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          {{ range .Site.Menus.main }}
          <li class="nav-item">
            <a class="nav-link" href="{{ .URL }}">{{ i18n .Name }}</a>
          </li>
          {{ end }}
        </ul>
        <div class="ms-lg-3 mt-2 mt-lg-0">
          {{ partial "lang-switcher.html" . }}
        </div>
      </div>
    </div>
  </div>
</header>
