{{ $carouselData := index site.Data .Site.Language.Lang "carousel" }}
{{ if $carouselData }}
<div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="5000">
  <div class="carousel-indicators">
    {{ range $i, $s := $carouselData.slides }}
    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="{{ $i }}" {{ if eq $i 0 }}class="active"{{ end }}></button>
    {{ end }}
  </div>
  <div class="carousel-inner">
    {{ range $i, $s := $carouselData.slides }}
    <div class="carousel-item {{ if eq $i 0 }}active{{ end }}">
      <div class="carousel-img" style="background-image: url('/images/carousel/{{ $s.image }}');"></div>
      <div class="carousel-overlay"></div>
      <div class="carousel-caption">
        <h2 class="carousel-title">{{ $s.title }}</h2>
        <p class="carousel-subtitle">{{ $s.subtitle }}</p>
      </div>
    </div>
    {{ end }}
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
{{ end }}
