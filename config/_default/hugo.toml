baseURL = 'https://yejia-lab.github.io/shu-urt-lab/'
title = '上海大学轨道交通无线通信联合实验室'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
enableGitInfo = false

[languages]
  [languages.zh]
    label = '中文'
    contentDir = 'content/zh'
    weight = 1
    title = '上海大学轨道交通无线通信联合实验室'
    description = '上海大学轨道交通无线通信联合实验室 - 专注轨道交通车地无线通信、信道建模、列车控制通信系统研究'

  [languages.en]
    label = 'English'
    contentDir = 'content/en'
    weight = 2
    title = 'Joint Laboratory of Rail Transit Wireless Communication, Shanghai University'
    description = 'Joint Laboratory of Rail Transit Wireless Communication at Shanghai University - Research on train-ground wireless communication, channel modeling, and CBTC systems'

[params]
  labName = '上海大学轨道交通无线通信联合实验室'
  labNameEn = 'Joint Laboratory of Rail Transit Wireless Communication, Shanghai University'
  university = '上海大学'
  universityEn = 'Shanghai University'
  school = '通信与信息工程学院'
  schoolEn = 'School of Communication and Information Engineering'
  copyright = '© 2025 上海大学轨道交通无线通信联合实验室'
  githubRepo = 'https://github.com/yejia-lab/shu-urt-lab'

disableKinds = ['taxonomy', 'term']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
